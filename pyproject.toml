[project]
name = "fly-games"
version = "0.1.0"
description = "Play mario, kung-fu/spartan-x and doom with a real fruit-fly brain: the MaleCNS v1.0 connectome (166,700 neurons, 25.6M synapses) drives every action."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flybrain>=0.1.0",
    "gym-super-mario-bros>=9.1.0",
    "gymnasium>=1.1",
    "nes-py>=9.0.1",
    "vizdoom>=1.2.4",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.35",
    "pillow>=12",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-dotenv>=1.2",
]

[project.scripts]
fly-games = "fly_games.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
target-version = "py313"
